<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MONO routecheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* ===== Pas hier de MONO-kleuren aan als de exacte huisstijlwaarden bekend zijn ===== */
:root{
  --zwart:#000; --wit:#fff; --papier:#F6F5EF; --geel:#FFD23F; --blauw:#2F5BFF; --grijs:#EDEDED; --grijs-d:#8A8A8A;
  --font:"Poppins", "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--papier);color:var(--zwart);font-family:var(--font);-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px 20px 24px}

/* Top: logo + route-voortgang */
.top{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.logo{width:38px;height:38px;flex:none;color:var(--zwart)}
.route{flex:1;height:18px;position:relative;margin:0 22px 0 18px}
.route::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;background:#D9D8D2}
.route .lijn{position:absolute;left:0;top:8px;height:2px;background:var(--zwart);transition:width .35s ease}
/* Zwart omlijnde bolletjes; ze lopen geel vol als je er voorbij bent */
.route .greep{position:absolute;top:3px;width:12px;height:12px;border-radius:50%;background:var(--papier);border:2px solid var(--zwart);transform:translateX(-6px);transition:background .3s}
.route .greep.aan{background:var(--geel)}
.taal{display:flex;border:2px solid var(--zwart);border-radius:99px;overflow:hidden;flex:none}
.taal button{font:inherit;font-weight:800;font-size:12px;background:var(--wit);color:var(--zwart);border:0;padding:4px 9px;cursor:pointer;line-height:1.2}
.taal button[aria-pressed="true"]{background:var(--zwart);color:var(--wit)}

.wandtag{display:inline-block;align-self:flex-start;font-size:13px;font-weight:600;border:2px solid var(--zwart);border-radius:99px;padding:3px 10px;margin-bottom:22px}
h1{font-weight:900;font-size:clamp(30px,8.5vw,40px);line-height:1.02;letter-spacing:-.02em;margin:0 0 10px}
.sub{font-size:15px;line-height:1.45;margin:0 0 24px;color:#333;max-width:36ch}
.stap{flex:1;display:flex;flex-direction:column}

/* Keuzes */
.keuzes{display:flex;flex-direction:column;gap:10px}
.keuzes.chips{flex-direction:row;flex-wrap:wrap}
.keuze{font:inherit;font-weight:600;font-size:17px;text-align:left;background:var(--wit);color:var(--zwart);border:2px solid var(--zwart);border-radius:14px;padding:15px 18px;cursor:pointer;transition:transform .08s ease, background .15s}
.chips .keuze{border-radius:99px;padding:11px 16px;font-size:15px}
.keuze:active{transform:scale(.97)}
.keuze[aria-pressed="true"]{background:var(--blauw);border-color:var(--blauw);color:var(--wit)}
/* Meerdere antwoorden mogelijk: plusje om toe te voegen, vinkje als het gekozen is */
.chips.multi .keuze::before{content:"+";display:inline-block;width:1em;margin-right:6px;font-weight:800;text-align:center}
.chips.multi .keuze[aria-pressed="true"]::before{content:"✓"}
.keuze small{display:block;font-weight:400;font-size:13px;opacity:.7;margin-top:2px}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--blauw);outline-offset:2px}

/* Top-out meter: het happiness-moment */
.meter{display:flex;flex-direction:column-reverse;gap:6px;position:relative;padding-left:4px}
.houvast{display:flex;align-items:center;gap:16px;background:none;border:0;padding:6px 0;font:inherit;cursor:pointer;text-align:left;color:var(--zwart)}
.houvast svg{width:56px;height:44px;flex:none;position:relative;z-index:1;transition:transform .15s}
.houvast svg path{fill:var(--grijs);stroke:var(--zwart);stroke-width:2.5;transition:fill .2s}
.houvast.aan svg path{fill:var(--kleur,var(--geel))}
.houvast .lbl{font-weight:600;font-size:16px}
.houvast .lbl b{font-weight:900;font-size:22px;margin-right:8px}
.houvast.gekozen .lbl{font-weight:800}
.topvlag{position:absolute;left:44px;top:-2px;font-size:11px;font-weight:800;background:var(--zwart);color:var(--wit);padding:2px 6px;opacity:0;transition:opacity .2s}
.meter.getopt .topvlag{opacity:1}

/* Hal-check */
.hal{display:flex;flex-direction:column;gap:18px}
.halrij .naam{font-weight:800;font-size:16px;margin-bottom:8px}
.halrij .keuzes{flex-direction:row;gap:8px}
.halrij .keuze{flex:1;text-align:center;padding:11px 6px;font-size:14px;border-radius:12px}

textarea{width:100%;min-height:130px;font:inherit;font-size:16px;border:2px solid var(--zwart);border-radius:14px;padding:14px;resize:vertical}
.teller{font-size:12px;color:var(--grijs-d);text-align:right;margin-top:6px}

/* Onderbalk */
.onder{display:flex;flex-direction:column;gap:6px;margin-top:28px;align-items:stretch}
.terug{order:2;align-self:center;font:inherit;font-weight:600;font-size:15px;background:none;border:0;padding:10px 16px;cursor:pointer;color:var(--zwart);text-decoration:underline;text-underline-offset:3px}
/* Brede knop over de hele breedte, op elk scherm even groot. "Terug" staat er als tekstlink onder. */
.door{font:inherit;font-weight:800;font-size:16px;flex:none;width:100%;order:1;background:var(--zwart);color:var(--wit);border:0;border-radius:99px;padding:17px 12px;cursor:pointer;text-align:center}

.door:disabled{background:transparent;color:var(--zwart);box-shadow:inset 0 0 0 2px var(--zwart);cursor:default}
.skip{font:inherit;font-weight:600;background:none;border:0;cursor:pointer;color:var(--grijs-d);padding:12px 4px}

.profielkaart{border:2px solid var(--zwart);border-radius:14px;padding:16px;margin-bottom:18px;font-size:15px;line-height:1.6}
.profielkaart b{font-weight:800}

/* Bedankscherm: blauw vlak, hele grote "Thank you!", zwart TOP-rondje en een weetje over de naam van de wand */
body.bedankt{background:var(--blauw)}
.dank{flex:1;display:flex;flex-direction:column;color:var(--wit)}
.dank .balk{display:flex;align-items:center;justify-content:space-between;margin:6px 0 30px}
.dank .logo{color:var(--wit)}
.dank .taaltabs button{color:rgba(255,255,255,.6)}
.dank .taaltabs button[aria-pressed="true"]{color:var(--wit);border-bottom-color:var(--wit)}
.dank .groot{position:relative;margin:0 0 34px}
.dank h1{font-weight:900;font-size:clamp(76px,28vw,136px);line-height:.8;letter-spacing:-.06em;margin:0 0 0 -4px}
.dank .rond{position:absolute;right:-4px;bottom:-30px;width:104px;height:104px;border-radius:50%;background:var(--zwart);color:var(--wit);display:grid;place-items:center;font-weight:900;font-size:24px;letter-spacing:.02em;transform:rotate(10deg)}
.dank .kicker{font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.05em;margin:0 0 8px;max-width:60%}
.dank .weetje{font-size:17px;line-height:1.45;margin:0 0 14px;max-width:32ch}
.dank .onder{margin-top:auto;padding-top:28px}
.prototype{background:var(--geel);border:2px solid var(--zwart);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;margin-bottom:20px}
.prototype button{font:inherit;font-weight:800;background:none;border:0;padding:0;margin-top:6px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--zwart)}
input:focus-visible{outline:3px solid var(--blauw);outline-offset:2px}
/* "Over jou": weinig tekst in rust. Eén rij knoppen en drie dikke schuiven; het antwoord verschijnt pas als je iets doet. */
.veldje{margin-bottom:18px}
.veldje .kopregel{font-weight:800;font-size:20px;line-height:1.15;letter-spacing:-.02em;min-height:34px;display:flex;align-items:flex-end;margin-bottom:8px}
.veldje:not(.leeg) .kopregel.wissel{font-weight:900;font-size:32px;letter-spacing:-.035em;line-height:1}
.pillen{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pillen .keuze{border-radius:99px;border-width:2.5px;padding:13px 2px;font-size:13px;font-weight:800;text-align:center;background:transparent}
.pillen .keuze[aria-pressed="true"]{background:var(--blauw);border-color:var(--blauw);color:var(--wit)}
.veldje input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:46px;margin:0;background:transparent;cursor:pointer;--v:.5;touch-action:pan-y}
/* de blauwe vulling loopt tot net voorbij de greep, zodat de greep op blauw ligt */
.veldje input[type=range]::-webkit-slider-runnable-track{height:46px;border-radius:99px;box-sizing:border-box;border:3px solid var(--zwart);
  background:linear-gradient(to right,var(--blauw) calc(20px + (100% - 40px) * var(--v) + 22px),#E3E2DC calc(20px + (100% - 40px) * var(--v) + 22px))}
.veldje input[type=range]::-moz-range-track{height:40px;border-radius:99px;border:3px solid var(--zwart);
  background:linear-gradient(to right,var(--blauw) calc(20px + (100% - 40px) * var(--v) + 22px),#E3E2DC calc(20px + (100% - 40px) * var(--v) + 22px))}
.veldje input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;margin-top:5px;border-radius:50%;background:var(--wit);border:0;box-shadow:inset 0 0 0 3.5px var(--zwart);transition:transform .12s ease}
.veldje input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--wit);border:0;box-shadow:inset 0 0 0 3.5px var(--zwart)}
.veldje input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
/* nog niet aangeraakt: rustige grijze baan zonder rand, blauwe greep in het midden */
.veldje.leeg input[type=range]::-webkit-slider-runnable-track{border-color:transparent;background:#E3E2DC}
.veldje.leeg input[type=range]::-moz-range-track{border-color:transparent;background:#E3E2DC}
.veldje.leeg input[type=range]::-webkit-slider-thumb{background:var(--blauw);box-shadow:inset 0 0 0 3.5px var(--zwart)}
.veldje.leeg input[type=range]::-moz-range-thumb{background:var(--blauw);box-shadow:inset 0 0 0 3.5px var(--zwart)}
.veldje .eindjes{display:flex;justify-content:space-between;font-size:12px;color:#555;margin-top:4px}
/* Startscherm: grote kop in brede kapitalen op papierkleur, roze knop, onderaan een strook uitsneden van de foto */
.start{flex:1;display:flex;flex-direction:column}
.start .balk{display:flex;align-items:center;justify-content:space-between;margin:6px 0 38px}
.start .merk{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px;letter-spacing:-.01em}
.start .merk .logo{width:34px;height:34px}
.taaltabs{display:flex;gap:6px}
.taaltabs button{font-family:inherit;font-weight:900;font-size:14px;letter-spacing:.06em;background:none;border:0;border-bottom:3px solid transparent;padding:4px 8px 6px;color:var(--grijs-d);cursor:pointer}
.taaltabs button[aria-pressed="true"]{color:var(--zwart);border-bottom-color:var(--zwart)}
.start h1{font-weight:900;text-transform:uppercase;font-size:clamp(44px,16.5vw,76px);line-height:.9;letter-spacing:-.035em;margin:0 0 22px}
.start .kicker{font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.05em;line-height:1.35;margin:0 0 8px}
.start .sub{margin-bottom:22px;max-width:34ch}
.start .cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.start .knop{font-family:inherit;font-weight:800;font-size:16px;background:var(--blauw);color:var(--wit);border:0;border-radius:99px;padding:17px 28px;cursor:pointer;transition:transform .08s ease}
.start .knop:active{transform:scale(.97)}
.start .cta small{font-size:14px;color:#555}
.strook{display:flex;gap:9px;margin:auto -20px 0;height:clamp(130px,24vh,210px);overflow:hidden}
.strook div{flex:none;height:100%;overflow:hidden;background:var(--grijs);position:relative}
.strook img{display:block;width:100%;height:100%;object-fit:cover}
.strook svg{position:absolute;overflow:visible}
.strook svg path{stroke:var(--zwart);stroke-width:2.5}
.fotobron{font-size:10px;color:var(--grijs-d);margin:6px 0 -10px}
.fout{background:#FFE9E6;border:2px solid #C4331D;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

// Standaard Nederlands. ?lang=en in de link of de knop bovenin zet Engels aan.
let taal = new URLSearchParams(location.search).get("lang")==="en" ? "en" : (lees(TAAL_KEY)==="en" ? "en" : "nl");
let T, VRAGEN, HAPPY, HAL, HALOPT;
function zetTaal(t){
  taal = t; T = TEKST[t]; document.documentElement.lang = t;
  const v = T.vragen, o = q => Object.entries(v[q].opties).map(([w,[t1,t2]])=>t2?[w,t1,t2]:[w,t1]);
  VRAGEN = {
    freq:{...v.freq,opties:o("freq")}, niveau:{titel:v.niveau.titel, sub:v.niveau.sub, opties:[["start",v.niveau.start],...NIVEAUS.map(n=>[n,v.niveau.n(n)])]}, lengte:{...v.lengte,opties:o("lengte")},
    terug:{...v.terug,opties:o("terug")},
    fit:{...v.fit,opties:o("fit")}, grade:{...v.grade,opties:o("grade")},
    stijl:{titel:v.stijl.titel, sub:v.stijl.sub, multi:true, opties:STIJLEN.map(s=>[s,T.stijl(s)])},
    mist:{titel:v.mist.titel, sub:v.mist.sub, multi:true, opties:[...STIJLEN.map(s=>[s,T.stijl(s)]),["niks",v.mist.niks]]},
    leeftijd:{...v.leeftijd,opties:o("leeftijd")}
  };
  HAPPY = T.happyOpt.map((t,k)=>[k+1,t]);
  HAL = Object.entries(T.halRij);
  HALOPT = Object.entries(T.halOpt);
}

const params = new URLSearchParams(location.search);
let wand = WANDEN.find(w=>w.id===params.get("wand")) || null;
let wandUitLink = !!wand; // wand kwam via de QR-link, dan slaan we de wandkeuze over
let profiel = lees(PROFIEL_KEY);
let profielOk = false;
const a = {happy:null,fit:null,terug:null,grade:null,stijl:[],mist:[],hal:{},tip:""};
const p = {freq:null,niveau:null,lengte:null,leeftijd:null};
const PROFIELVRAGEN = ["freq","niveau","lengte","leeftijd"];
let pad = [], i = 0, fout = "";

function lees(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function schrijf(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let lengteCm = 175;
function lengteBak(cm){return cm<160?"-160":cm<170?"160-170":cm<180?"170-180":cm<190?"180-190":"190+"}
function lengteTekst(cm){const m=(cm/100).toFixed(2).replace(".",taal==="en"?".":","); return cm<=150?`${m} ${T.korter}`:cm>=200?`${m} ${T.langer}`:`${m} m`}
// Hoe een gekozen antwoord groot in beeld komt: "25 tot 34" wordt "25 tot 34 jaar"
function toon(q,tekst){return q==="leeftijd"&&/^\d+ \S+ \d+$/.test(tekst)?tekst+" "+T.jaar:tekst}
function knopBijwerken(){const k=document.querySelector(".door"), open=PROFIELVRAGEN.filter(x=>!p[x]).length; if(!k) return; k.disabled=open>0; k.textContent=open?T.nog(open):T.verstuur;}
function profielCompleet(){return PROFIELVRAGEN.every(q=>p[q])}
function label(vraag,waarde){const o=VRAGEN[vraag].opties.find(o=>o[0]===waarde);return o?o[1]:"";}
zetTaal(taal);

function bouwPad(){
  pad = ["start"];
  if(!wandUitLink) pad.push("wand");
  pad.push("happy");
  pad.push("fit","terug","grade","stijl","mist","hal","tip");
  if(!profielOk) pad.push("over"); // vragen over de klimmer: samen op één pagina, aan het eind
  pad.push("klaar");
}

function voortgang(){
  const n = pad.length-1, pct = Math.min(1,i/n)*100;
  let g = "";
  // Zes grepen, hoe lang het formulier ook is: rustiger dan één greep per vraag
  const G = 6;
  for(let k=0;k<G;k++){const x=k/(G-1)*100;g+=`<span class="greep ${x<=pct+.01?'aan':''} ${k===G-1?'top':''}" style="left:${x}%;--kleur:${KLEUREN[k%KLEUREN.length]}"></span>`}
  return `<div class="top"><svg class="logo" viewBox="0 0 553.5 553.5" role="img" aria-label="MONO"><path d="M553.5 553.5V0L276.632 276.632L0 0V553.5Z" fill="currentColor"/></svg><div class="route" aria-hidden="true"><span class="lijn" style="width:${pct}%"></span>${g}</div><div class="taaltabs" role="group" aria-label="Taal / Language"><button data-taal="nl" aria-pressed="${taal==='nl'}">NL</button><button data-taal="en" aria-pressed="${taal==='en'}">EN</button></div></div>`;
}

function onder(opts={}){
  return `<div class="onder">${i>0?`<button class="terug" data-act="terug">${T.terug}</button>`:''}
    ${opts.door?`<button class="door" data-act="door" ${opts.disabled?'disabled':''}>${opts.door}</button>`:''}</div>`;
}

function render(){
  const stap = pad[i]; const app = document.getElementById("app");
  document.body.classList.toggle("bedankt", stap==="klaar");
  const wandTag = wand?`<span class="wandtag">${wand.naam}</span>`:"";
  let h = voortgang();

  if(stap==="start"){
    const gedaan = lees(GEDAAN_KEY)||{}; const vandaag = new Date().toISOString().slice(0,10);
    const al = wand && gedaan[wand.id]===vandaag;
    const f = wand && FOTOS[wand.id];
    const kicker = wand ? `${T.startSet} ${esc(wand.naam)}${f?", "+f.plek[taal].split(",")[0]:""}` : "";
    // Eigen kop met logo en taalkeuze; de balk met bolletjes begint pas bij de eerste vraag
    h = `<div class="start"><div class="balk"><div class="merk"><svg class="logo" viewBox="0 0 553.5 553.5" role="img" aria-label="MONO"><path d="M553.5 553.5V0L276.632 276.632L0 0V553.5Z" fill="currentColor"/></svg></div>
        <div class="taaltabs" role="group" aria-label="Taal / Language"><button data-taal="nl" aria-pressed="${taal==='nl'}">NL</button><button data-taal="en" aria-pressed="${taal==='en'}">EN</button></div></div>
      <h1>${T.start}</h1>
      ${kicker?`<p class="kicker">${kicker}</p>`:""}
      <p class="sub">${T.startSub}${al?T.alGedaan:''}</p>`;
    if(profiel){
      h += `<div class="profielkaart">${T.profiel(label("niveau",profiel.niveau).toLowerCase(),label("freq",profiel.freq).toLowerCase())}</div>
        <div class="keuzes" style="margin-bottom:26px"><button class="keuze" data-act="profiel-ja">${T.profielJa}</button><button class="keuze" data-act="profiel-nee">${T.profielNee}</button></div>`;
    } else {
      h += `<div class="cta"><button class="knop" data-act="door">${T.start_knop}</button><small>${T.startExtra}</small></div>`;
    }
    h += strook() + (f&&f.bron?`<p class="fotobron">${taal==="en"?"Photo":"Foto"}: ${f.bron}, via Wikimedia Commons</p>`:"") + `</div>`;
  }
  else if(stap==="wand"){
    // Uitleg alleen in het prototype (zonder ENDPOINT), niet voor klimmers in de echte versie
    const uitleg = ENDPOINT ? "" : `<div class="prototype">${T.prototype}<br><button data-act="demo-qr">${T.prototypeKnop}</button></div>`;
    h += `<section class="stap">${uitleg}<h1>${T.wand}</h1><p class="sub">${T.wandSub}</p>
      <div class="keuzes">${WANDEN.map(w=>`<button class="keuze" data-wand="${w.id}" aria-pressed="${wand&&wand.id===w.id}">${w.naam}</button>`).join("")}</div></section>` + onder();
  }
  else if(stap==="happy"){
    const v=a.happy;
    h += `<section class="stap">${wandTag}<h1 style="margin-bottom:24px">${T.happy}</h1>
      <div class="meter ${v===5?'getopt':''}" role="radiogroup" aria-label="${T.happyAria}">
      ${HAPPY.map(([n,t])=>`<button class="houvast ${v&&n<=v?'aan':''} ${v===n?'gekozen':''}" role="radio" aria-checked="${v===n}" data-happy="${n}" style="--kleur:var(--blauw)">
        <svg viewBox="0 0 56 44" aria-hidden="true"><path d="${greepVorm(n)}"/></svg><span class="lbl"><b>${n}</b>${t}</span></button>`).join("")}
      <span class="topvlag">TOP</span></div></section>` + onder({door:T.verder,disabled:!v});
  }
  else if(stap==="hal"){
    h += `<section class="stap"><h1 style="margin-bottom:24px">${T.hal}</h1><div class="hal">
      ${HAL.map(([k,t])=>`<div class="halrij"><div class="naam">${t}</div><div class="keuzes">
        ${HALOPT.map(([o,ot])=>`<button class="keuze" data-hal="${k}" data-val="${o}" aria-pressed="${a.hal[k]===o}">${ot}</button>`).join("")}</div></div>`).join("")}
      </div></section>` + onder({door:T.verder,skip:!Object.keys(a.hal).length});
  }
  else if(stap==="over"){
    // In rust staat er alleen de vraag. Zodra je schuift, maakt de vraag plaats voor je antwoord, groot.
    const schuif = q => { const o=VRAGEN[q].opties, k=o.findIndex(x=>x[0]===p[q]), leeg=k<0, v=leeg?Math.floor((o.length-1)/2):k;
      return `<div class="veldje ${leeg?"leeg":""}"><div class="kopregel wissel" data-vraag="${T.kort[q]}">${leeg?T.kort[q]:toon(q,o[k][1])}</div>
        <input type="range" min="0" max="${o.length-1}" step="1" value="${v}" data-schuif="${q}" aria-label="${T.kort[q]}" style="--v:${v/(o.length-1)}">
        <div class="eindjes"><span>${T.eind[q][0]}</span><span>${T.eind[q][1]}</span></div></div>`; };
    const lg = !p.lengte;
    if(lg) lengteCm = 175; else if(lengteBak(lengteCm)!==p.lengte) lengteCm = {"-160":155,"160-170":165,"170-180":175,"180-190":185,"190+":193}[p.lengte];
    const komma = taal==="en"?".":",";
    h += `<section class="stap"><h1 style="margin-bottom:14px">${T.over}</h1>
      <div class="veldje"><div class="kopregel">${T.kort.freq}</div>
        <div class="pillen">${VRAGEN.freq.opties.map(([w,t])=>`<button class="keuze" data-prof="freq" data-val="${w}" aria-pressed="${p.freq===w}">${t}</button>`).join("")}</div></div>
      ${schuif("niveau")}
      <div class="veldje ${lg?"leeg":""}"><div class="kopregel wissel" data-vraag="${T.kort.lengte}">${lg?T.kort.lengte:lengteTekst(lengteCm)}</div>
        <input type="range" min="150" max="200" step="1" value="${lengteCm}" data-schuif="lengte" aria-label="${T.kort.lengte}" style="--v:${(lengteCm-150)/50}">
        <div class="eindjes"><span>1${komma}50 m</span><span>2${komma}00 m</span></div></div>
      ${schuif("leeftijd")}
      </section>` + onder({door:profielCompleet()?T.verstuur:T.nog(PROFIELVRAGEN.filter(q=>!p[q]).length),disabled:!profielCompleet()});
  }
  else if(stap==="tip"){
    h += `<section class="stap"><h1>${T.tip}</h1><p class="sub">${T.tipSub}</p>
      <label for="tip" class="sub" style="position:absolute;left:-9999px">Tip</label>
      <textarea id="tip" maxlength="400" placeholder="${T.tipPlaceholder}">${esc(a.tip)}</textarea>
      <div class="teller"><span id="tel">${a.tip.length}</span>/400</div></section>` + onder({door: pad[i+1]==="klaar"?T.verstuur:T.verder});
  }
  else if(stap==="klaar"){
    const weetje = wand && WEETJES[wand.id];
    const delen = T.klaar.split(" "); // "Thank" / "you!" onder elkaar
    h = `<div class="dank"><div class="balk"><svg class="logo" viewBox="0 0 553.5 553.5" role="img" aria-label="MONO"><path d="M553.5 553.5V0L276.632 276.632L0 0V553.5Z" fill="currentColor"/></svg>
        <div class="taaltabs" role="group" aria-label="Taal / Language"><button data-taal="nl" aria-pressed="${taal==='nl'}">NL</button><button data-taal="en" aria-pressed="${taal==='en'}">EN</button></div></div>
      <div class="groot"><h1>${delen[0]}<br>${delen.slice(1).join(" ")}</h1><div class="rond" aria-hidden="true">TOP!</div></div>
      ${weetje?`<p class="kicker">${T.wistJe}</p><p class="weetje">${weetje[taal]}</p>`:""}
      ${fout?`<div class="fout" style="color:var(--zwart)">${fout}</div>`:""}
      <div class="onder"><button class="door" data-act="sluiten">${T.sluiten}</button></div></div>`;
  }
  else {
    const q = VRAGEN[stap]; const bron = a;
    const huidig = bron[stap];
    const isAan = (w)=> q.multi ? huidig.includes(w) : huidig===w;
    h += `<section class="stap">${wandTag}${q.sub?`<h1>${q.titel}</h1><p class="sub">${q.sub}</p>`:`<h1 style="margin-bottom:24px">${q.titel}</h1>`}
      <div class="keuzes ${q.multi?'chips multi':''}">${q.opties.map(([w,t,s])=>`<button class="keuze" data-q="${stap}" data-val="${w}" aria-pressed="${isAan(w)}">${t}${s?`<small>${s}</small>`:""}</button>`).join("")}</div></section>`;
    const laatste = pad[i+1]==="klaar";
    h += q.multi ? onder({door:T.verder,skip:!huidig.length}) : onder(laatste&&huidig?{door:T.verstuur}:{});
  }
  app.innerHTML = h;
  window.scrollTo(0,0);
  // Schuiven op "over jou": pas bij aanraken telt een antwoord, zodat niemand ongemerkt de middenstand instuurt
  document.querySelectorAll("[data-schuif]").forEach(el=>{
    const q=el.dataset.schuif, vak=el.closest(".veldje"), lab=vak.querySelector(".kopregel"); let vorige=null;
    const zet=()=>{ const v=+el.value;
      if(q==="lengte"){ lengteCm=v; p.lengte=lengteBak(v); lab.textContent=lengteTekst(v); el.style.setProperty("--v",(v-150)/50); }
      else { const o=VRAGEN[q].opties; p[q]=o[v][0]; lab.textContent=toon(q,o[v][1]); el.style.setProperty("--v",v/(o.length-1));
        if(vorige!==null&&vorige!==v&&navigator.vibrate) navigator.vibrate(8); } // tikje bij elke stap, op telefoons die dat kunnen
      vorige=v; vak.classList.remove("leeg"); knopBijwerken(); };
    ["input","change","pointerdown","keydown"].forEach(ev=>el.addEventListener(ev,()=>setTimeout(zet,0)));
  });
  const ta = document.getElementById("tip");
  if(ta) ta.addEventListener("input",()=>{a.tip=ta.value;document.getElementById("tel").textContent=ta.value.length});
}

// Strook onderaan het startscherm: vier uitsneden van de foto van de echte plek, als contactafdruk.
// Geen foto (of hij laadt niet)? Dan vier vlakken met getekende grepen, elk vlak één route in één kleur.
function strook(){
  const f = wand && FOTOS[wand.id];
  const UIT = [[30,"12% 78%"],[44,"50% 62%"],[44,"38% 30%"],[30,"80% 55%"]]; // [breedte %, welk deel van de foto]
  if(f) return `<div class="strook" aria-hidden="true">${UIT.map(([b,pos])=>`<div style="width:${b}%"><img src="fotos/${wand.id}.jpg" alt="" style="object-position:${pos}" onerror="this.closest('.strook').outerHTML=strookGetekend()"></div>`).join("")}</div>`;
  // Wand nog niet bekend (algemene QR-code): één uitsnede van vier verschillende plekken
  const ids = Object.keys(FOTOS).slice(0,4);
  if(!wand && ids.length===4) return `<div class="strook" aria-hidden="true">${ids.map((id,k)=>`<div style="width:${UIT[k][0]}%"><img src="fotos/${id}.jpg" alt="" style="object-position:${FOTOS[id].pos||"50% 50%"}" onerror="this.parentElement.remove()"></div>`).join("")}</div>`;
  return strookGetekend();
}
function strookGetekend(){
  const V = [[30,KLEUREN[1],[[18,58,1,-8],[48,18,3,14]]],[44,KLEUREN[0],[[12,62,4,10],[52,34,1,-14],[30,4,5,12]]],[44,KLEUREN[2],[[50,60,2,-10],[14,30,4,16],[56,4,3,6]]],[30,KLEUREN[1],[[30,56,5,8],[10,14,2,-12]]]];
  return `<div class="strook" aria-hidden="true">${V.map(([b,kleur,g])=>`<div style="width:${b}%">${g.map(([x,y,v,r])=>`<svg viewBox="0 0 56 44" style="left:${x}%;top:${y}%;width:46px;transform:rotate(${r}deg)"><path d="${greepVorm(v)}" fill="${kleur}"/></svg>`).join("")}</div>`).join("")}</div>`;
}
function greepVorm(n){
  const v=["M8 30c0-10 9-20 22-20s18 8 18 16-10 12-20 12S8 40 8 30z","M6 26c2-11 14-16 26-14s18 10 16 18-14 10-24 9S4 34 6 26z",
    "M10 22c4-9 16-12 26-8s12 14 6 20-18 8-26 4S6 30 10 22z","M7 28c0-12 12-18 24-17s17 9 15 17-12 14-23 12S7 38 7 28z","M9 24c3-10 15-14 25-11s15 12 10 20-17 10-26 6S6 32 9 24z"];
  return v[n-1];
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function volgende(){ if(i<pad.length-1){ i++; if(pad[i]==="klaar") verstuur(); render(); } }

document.addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  const act=b.dataset.act;
  if(act==="demo-qr"){ wand=WANDEN.find(w=>w.id==="bosigran"); wandUitLink=true; bouwPad(); i=0; render(); return; }
  if(b.dataset.taal){ zetTaal(b.dataset.taal); schrijf(TAAL_KEY,taal); render(); return; }
  if(act==="terug"){ i=Math.max(0,i-1); render(); return; }
  if(act==="door"){ volgende(); return; }
  // Sluiten: het tabblad dicht als de browser dat toelaat, anders terug naar het begin
  if(act==="sluiten"){ window.close(); setTimeout(()=>location.reload(),200); return; }
  // Klopt het profiel nog en is het compleet, dan slaan we de pagina "over jou" over. Anders staat hij ingevuld klaar.
  if(act==="profiel-ja"||act==="profiel-nee"){ PROFIELVRAGEN.forEach(q=>p[q]=VRAGEN[q].opties.some(o=>o[0]===profiel[q])?profiel[q]:null); profielOk=act==="profiel-ja"&&profielCompleet(); bouwPad(); i=1; render(); return; }
  if(b.dataset.prof){ p[b.dataset.prof]=b.dataset.val; // zonder opnieuw tekenen, zodat de pagina niet naar boven springt
    b.parentElement.querySelectorAll(".keuze").forEach(x=>x.setAttribute("aria-pressed",x===b)); knopBijwerken(); return; }
  if(b.dataset.wand){ wand=WANDEN.find(w=>w.id===b.dataset.wand); render(); setTimeout(volgende,220); return; }
  if(b.dataset.happy){ a.happy=+b.dataset.happy; // zonder opnieuw tekenen: de grepen blijven staan en de pagina springt niet
    document.querySelectorAll(".houvast").forEach(x=>{const n=+x.dataset.happy; x.classList.toggle("aan",n<=a.happy); x.classList.toggle("gekozen",n===a.happy); x.setAttribute("aria-checked",n===a.happy)});
    document.querySelector(".meter").classList.toggle("getopt",a.happy===5); document.querySelector(".door").disabled=false; return; }
  if(b.dataset.hal){ const k=b.dataset.hal; a.hal[k]=a.hal[k]===b.dataset.val?undefined:b.dataset.val; if(!a.hal[k]) delete a.hal[k]; render(); return; }
  if(b.dataset.q){
    const q=b.dataset.q, w=b.dataset.val, vr=VRAGEN[q], bron=a;
    if(vr.multi){
      let l=bron[q];
      if(w==="niks") l = l.includes("niks")?[]:["niks"];
      else { l=l.filter(x=>x!=="niks"); l = l.includes(w)?l.filter(x=>x!==w):[...l,w]; }
      bron[q]=l; render();
    } else {
      bron[q]=w;
      render();
      if(pad[i+1]!=="klaar") setTimeout(volgende,220);
    }
  }
});

async function verstuur(){
  const prof = {freq:p.freq, niveau:p.niveau, lengte:p.lengte, leeftijd:p.leeftijd};
  if(!profielOk && profielCompleet()){ schrijf(PROFIEL_KEY, prof); profiel = prof; }
  const gedaan = lees(GEDAAN_KEY)||{}; const vandaag=new Date().toISOString().slice(0,10);
  const herhaal = wand && gedaan[wand.id]===vandaag;
  if(wand){ gedaan[wand.id]=vandaag; schrijf(GEDAAN_KEY,gedaan); }
  const payload = { wand: wand?wand.id:"", ...a, ...prof, herhaal: !!herhaal,
    sessie: Math.random().toString(36).slice(2,10) };
  if(!ENDPOINT){ console.log("Testmodus, niet verstuurd:",payload); return; }
  try{
    await fetch(ENDPOINT,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)});
  }catch(err){
    fout = T.fout;
    render();
  }
}

bouwPad(); render();
</script>
